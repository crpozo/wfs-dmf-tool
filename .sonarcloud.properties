# SonarCloud automatic analysis settings.
# Third-party files copied into the repo are not our code: their findings
# (e.g. Bootstrap's utility classes are built on "!important") cannot be fixed here.
sonar.exclusions=public/css/bootstrap.css,public/js/p5.js,public/js/p5.sound.min.js,public/js/select2.min.js,public/js/bootstrap.bundle.min.js,vendor/**,node_modules/**

# The old /draw page (route /draw, draw.blade.php) runs an earlier copy of the drawing
# tool that /drawfence (the s_*.js files) grew out of. The two are duplicates by origin;
# they are still analysed for issues, only left out of duplicate detection.
sonar.cpd.exclusions=public/js/edge.js,public/js/utils.js,public/js/sketch.js,public/js/graph.js,public/js/vert.js,public/js/dim.js,public/js/tool.js,public/js/toolbar.js
