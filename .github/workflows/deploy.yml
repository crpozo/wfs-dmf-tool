# Deploys the app on every push:
#   staging -> the staging site (same EC2, /var/www/drawfence-staging)
#   main    -> production (app.westernfencesupply.com), after a reviewer approves the
#              "production" environment run
#
# No SSH and no AWS keys: the job gets short-lived credentials through GitHub OIDC, one IAM role
# per environment. Each role can only run that environment's SSM document (a fixed deploy
# command on the server) and invalidate that environment's CloudFront distribution.
#
# Environment secrets (Settings > Environments > staging / production). Secrets rather than
# variables because this repository is public and its Actions logs are public too; secrets are
# masked in them.
#   AWS_DEPLOY_ROLE_ARN          IAM role this environment assumes
#   EC2_INSTANCE_ID              the server
#   SSM_DOCUMENT                 DrawFence-DeployStaging / DrawFence-DeployProduction
#   CLOUDFRONT_DISTRIBUTION_ID   the environment's distribution
name: Deploy

on:
  push:
    branches: [staging, main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# One deploy at a time on the server: staging and production share the EC2.
concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == 'staging' || github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    timeout-minutes: 20
    env:
      INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
      SSM_DOCUMENT: ${{ secrets.SSM_DOCUMENT }}
      DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy on the server (SSM)
        run: |
          set -euo pipefail
          id=$(aws ssm send-command \
            --document-name "$SSM_DOCUMENT" \
            --instance-ids "$INSTANCE_ID" \
            --comment "$GITHUB_REF_NAME ${GITHUB_SHA::7}" \
            --query Command.CommandId --output text)
          echo "SSM command $id"

          status=Pending
          for _ in $(seq 1 90); do
            sleep 10
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done

          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text || true
          echo "Status: $status"
          [ "$status" = Success ]

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*" \
            --query Invalidation.Status --output text
